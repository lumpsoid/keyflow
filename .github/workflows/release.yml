# Pushing a tag vX.Y.Z (made by scripts/release.sh) builds signed Android
# APKs and Linux bundles (x64, arm64) and publishes them as a GitHub
# Release, with the tag's message (the changelog section) as the notes.
#
# Needs these repository secrets (docs/maintaining.md explains them):
#   ANDROID_KEYSTORE_BASE64   the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the version
        run: |
          version=$(scripts/version.sh show | cut -d+ -f1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: scripts/check.sh

  android:
    name: Android APKs
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Never publish a debug-signed release.
          [ -n "$KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}" \
            --dart-define=GIT_COMMIT="$(git rev-parse --short=7 HEAD)"

      - name: Name the APKs
        run: |
          mkdir dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            cp "$apk" "dist/typing-practice-${GITHUB_REF_NAME}-android-${abi}.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      # A git checkout of the pinned version works on both architectures.
      - name: Install Flutter
        run: |
          version=$(sed -n 's/^  flutter: \(.*\)$/\1/p' pubspec.yaml)
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get

      - name: Build
        run: |
          flutter build linux --release \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}" \
            --dart-define=GIT_COMMIT="$(git rev-parse --short=7 HEAD)"

      - name: Pack the bundle
        run: |
          mkdir dist
          name="typing-practice-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          cp -r "build/linux/${{ matrix.arch }}/release/bundle" "$name"
          tar -czf "dist/$name.tar.gz" "$name"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish the release
    needs: [android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # actions/checkout fetches the tag without its annotation; the
      # release notes live in the annotation.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Release notes from the tag
        run: git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          name: Typing Practice ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
